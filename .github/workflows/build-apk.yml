# Build the ScanPilot debug APK on every push to main.
# The APK is uploaded as a build artifact — download it from the
# Actions tab (pick the latest run → Artifacts → scanpilot-debug-apk).
# No signing is involved: this is a debug APK for testing, not a Play release.
#
# NOTE: the project targets API 36 with AGP 8.5.2. If this workflow fails
# with an error about compileSdk 36 needing a newer Android Gradle Plugin,
# bump the AGP version in the root build.gradle.kts to 8.10.0 or newer
# (and the matching Kotlin/KSP versions) and re-run.

name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scanpilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
